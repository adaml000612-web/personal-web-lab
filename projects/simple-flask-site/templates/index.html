<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flask Studio</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        --blue: #60a5fa;
        --violet: #a78bfa;
        --muted: #94a3b8;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        min-height: 100vh;
        margin: 0;
        color: #f8fafc;
        background:
          radial-gradient(circle at 12% 18%, rgba(37, 99, 235, .62) 0, transparent 30%),
          radial-gradient(circle at 88% 72%, rgba(124, 58, 237, .58) 0, transparent 30%),
          #09090b;
      }
      a { color: inherit; text-decoration: none; }
      a:focus-visible, button:focus-visible, input:focus-visible {
        outline: 3px solid #bfdbfe;
        outline-offset: 3px;
      }
      .nav {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 22px 0;
      }
      .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: -.02em; }
      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 11px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        box-shadow: 0 10px 30px rgba(59, 130, 246, .34);
      }
      .nav-links { display: flex; align-items: center; gap: 28px; color: #cbd5e1; }
      .nav-links a:hover { color: white; }
      .logout { margin: 0; }
      .logout button {
        width: auto;
        margin: 0;
        padding: 9px 16px;
        color: #e2e8f0;
        background: rgba(15, 23, 42, .52);
        border: 1px solid rgba(148, 163, 184, .3);
      }
      main {
        display: grid;
        min-height: calc(100vh - 78px);
        place-items: center;
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 52px 0 110px;
      }
      .hero {
        display: grid;
        grid-template-columns: 1.1fr .9fr;
        gap: 58px;
        align-items: center;
        width: 100%;
      }
      .eyebrow { margin: 0 0 18px; color: #93c5fd; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
      h1 { margin: 0; max-width: 720px; font-size: clamp(54px, 7vw, 92px); line-height: .98; letter-spacing: -.065em; }
      .gradient-text {
        color: transparent;
        background: linear-gradient(100deg, #93c5fd, #c4b5fd 65%, #f0abfc);
        background-clip: text;
      }
      .lead { max-width: 610px; margin: 28px 0 0; color: #cbd5e1; font-size: 20px; line-height: 1.7; }
      .card {
        padding: 36px;
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 26px;
        background: rgba(15, 23, 42, .78);
        box-shadow: 0 30px 80px rgba(0,0,0,.4);
        backdrop-filter: blur(18px);
      }
      .card h2 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.035em; }
      .card-copy { margin: 0 0 25px; color: var(--muted); line-height: 1.6; }
      label { display: block; margin-bottom: 9px; color: #dbeafe; font-weight: 650; }
      input {
        width: 100%;
        padding: 15px 16px;
        color: white;
        background: rgba(2, 6, 23, .68);
        border: 1px solid rgba(148, 163, 184, .36);
        border-radius: 13px;
        outline: none;
        font: inherit;
      }
      input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(96, 165, 250, .14); }
      button {
        width: 100%;
        margin-top: 15px;
        padding: 15px 20px;
        color: white;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        border: 0;
        border-radius: 13px;
        cursor: pointer;
        font: inherit;
        font-weight: 750;
      }
      button:hover { filter: brightness(1.08); transform: translateY(-1px); }
      .message { margin: 18px 0 0; padding: 15px 16px; border-radius: 13px; line-height: 1.5; }
      .success { color: #bbf7d0; background: rgba(22, 101, 52, .28); border: 1px solid rgba(74, 222, 128, .3); }
      .error { color: #fecaca; background: rgba(127, 29, 29, .28); border: 1px solid rgba(248, 113, 113, .3); }
      @media (max-width: 820px) {
        .hero { grid-template-columns: 1fr; gap: 38px; }
        .nav-links > a { display: none; }
        h1 { font-size: clamp(48px, 15vw, 72px); }
        main { padding-top: 36px; }
      }
      @media (max-width: 520px) {
        .nav, main { width: min(100% - 28px, 1120px); }
        .nav { padding: 16px 0; }
        .brand-mark { width: 31px; height: 31px; }
        .logout button { padding: 8px 12px; }
        main { min-height: auto; padding: 48px 0 72px; }
        .hero { gap: 30px; }
        h1 { font-size: clamp(44px, 14vw, 62px); }
        .lead { margin-top: 20px; font-size: 17px; }
        .card { padding: 25px 20px; border-radius: 21px; }
      }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { transition: none !important; }
        button:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="{{ url_for('home') }}">
        <span class="brand-mark">F</span>
        <span>Flask Studio</span>
      </a>
      <div class="nav-links">
        <a href="#home">首页</a>
        <a href="#greeting">互动体验</a>
        <form class="logout" method="post" action="{{ url_for('logout') }}">
          <button type="submit">退出登录</button>
        </form>
      </div>
    </nav>
    <main id="home">
      <section class="hero">
        <div>
          <p class="eyebrow">Flask · Frontend + Backend</p>
          <h1>让每次问候都更<span class="gradient-text">有温度。</span></h1>
          <p class="lead">欢迎回来，{{ session.username }}。输入你的名字，Flask 后端会处理请求，并为你生成一条专属欢迎语。</p>
        </div>
        <div class="card" id="greeting">
          <h2>认识一下吧 👋</h2>
          <p class="card-copy">告诉我们该如何称呼你。</p>
          <form method="post" action="{{ url_for('home') }}">
            <label for="name">你的名字</label>
            <input id="name" name="name" type="text" maxlength="50" placeholder="例如：Adam" autocomplete="name" required>
            <button type="submit">生成欢迎语</button>
          </form>
          {% if greeting %}<p class="message success" role="status">{{ greeting }}</p>{% endif %}
          {% if name_error %}<p class="message error" role="alert">{{ name_error }}</p>{% endif %}
        </div>
      </section>
    </main>
  </body>
</html>
